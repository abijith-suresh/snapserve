server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:default-fallback-secret}

auth:
  login:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration-minutes: ${AUTH_LOCK_DURATION_MINUTES:15}

spring:
  application:
    name: auth-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/snapserve}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true
