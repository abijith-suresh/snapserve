spring:
  application:
    name: booking-service
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: 9002

management:
  endpoints:
    web:
      exposure:
        include: health,info

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:9001}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:9003}
