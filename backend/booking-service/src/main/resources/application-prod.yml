spring:
  data:
    mongodb:
      auto-index-creation: false

server:
  shutdown: graceful

user:
  service:
    url: ${USER_SERVICE_URL}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL}

logging:
  level:
    com.snapserve.booking: WARN
  include-application-name: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
