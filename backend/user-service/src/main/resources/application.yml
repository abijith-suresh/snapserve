spring:
  application:
    name: user-service
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

server:
  port: 9001

logging:
  level:
    com.snapserve.user: INFO
  include-application-name: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:9003}
