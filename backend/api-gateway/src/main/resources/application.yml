spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates: [Path=/api/v1/auth/**]
            - id: customer-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/v1/customers,/api/v1/customers/**
            - id: specialist-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/v1/specialists,/api/v1/specialists/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL}
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**
            - id: review-service
              uri: ${BOOKING_SERVICE_URL}
              predicates:
                - Path=/api/v1/reviews,/api/v1/reviews/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**

server:
  port: 9090

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

management:
  health:
    mongo:
      enabled: false
    mongodb:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
