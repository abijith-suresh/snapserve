spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL}
            predicates: [Path=/api/auth/**]
          - id: user-service
            uri: ${USER_SERVICE_URL}
            predicates:
              [Path=/api/v1/customers/**, Path=/api/v1/specialists/**, Path=/api/v1/admin/**]
          - id: booking-service
            uri: ${BOOKING_SERVICE_URL}
            predicates:
              [Path=/api/v1/bookings/**, Path=/api/v1/reviews/**, Path=/api/v1/complaints/**]
          - id: notification-service
            uri: ${NOTIFICATION_SERVICE_URL}
            predicates: [Path=/api/notifications/**]

server:
  port: 9090

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
