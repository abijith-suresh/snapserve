services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapserve}
      POSTGRES_USER: ${POSTGRES_USER:-snapserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting SnapServe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapserve} -d ${POSTGRES_DB:-snapserve}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - snapserve-network

  snapserve-api:
    build:
      context: .
      dockerfile: backend/snapserve-api/Dockerfile
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-snapserve}
      DATABASE_USERNAME: ${POSTGRES_USER:-snapserve}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting SnapServe}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting SnapServe}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - snapserve-network

volumes:
  postgres_data:

networks:
  snapserve-network:
    driver: bridge
